---
- hosts: all
  user: ansible
  become: true
  gather_facts: true
  vars_files:
    - project1/vars/variables.yaml
  roles:
    - project1

  tasks:
    - name: update repo
      ansible.builtin.apt:
        update_cache: true
      when:
       - operation == "install"
       - ansible_facts["os_family"]=="Debian"

    - name: update repo
      ansible.builtin.yum:
        update_cache: true
      when:
       - operation == "install"
       - ansible_facts["os_family"]=="RedHat"

    - name: copy data
      ansible.builtin.import_tasks: project1/tasks/copy.yaml
      when:
        - operation == "copy"

    - name: import install task
      ansible.builtin.import_tasks: project1/tasks/install.yaml
      when:
        - operation == "install"
      notify: restart nginx

